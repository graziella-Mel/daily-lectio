<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Daily Lectio" />
  <meta name="theme-color" content="#0e0c14" />
  <title>Daily Lectio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root { --sans: 'DM Sans', sans-serif; --serif: 'Lora', Georgia, serif; --bg: #0e0c14; }
    html, body { height: 100%; background: var(--bg); overflow: hidden; font-family: var(--sans); color: white; -webkit-font-smoothing: antialiased; }
    #app { height: 100dvh; display: flex; flex-direction: column; position: relative; overflow: hidden; }

    /* ── LOADING ── */
    #loading {
      position: absolute; inset: 0; z-index: 100; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      transition: opacity 0.5s ease;
    }
    #loading.fade { opacity: 0; pointer-events: none; }
    .loading-icon { font-size: 28px; animation: breathe 2.4s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:.3;transform:scale(.95)} 50%{opacity:1;transform:scale(1.05)} }
    .loading-title { font-family: var(--serif); font-size: 20px; font-style: italic; color: rgba(255,255,255,.65); }
    .loading-sub { font-size: 12px; color: rgba(255,255,255,.3); text-align: center; padding: 0 40px; line-height: 1.7; }
    .spinner { width: 22px; height: 22px; border: 1.5px solid rgba(255,255,255,.1); border-top-color: rgba(255,255,255,.55); border-radius: 50%; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── ERROR ── */
    #error { position: absolute; inset: 0; z-index: 99; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 40px; }
    #error.show { display: flex; }
    .err-msg { font-size: 14px; color: rgba(255,255,255,.45); text-align: center; line-height: 1.7; }
    .retry-btn { margin-top: 6px; padding: 10px 28px; background: rgba(255,255,255,.08); border: .5px solid rgba(255,255,255,.2); border-radius: 10px; color: rgba(255,255,255,.7); font-size: 13px; cursor: pointer; font-family: var(--sans); }

    /* ── TOP BAR ── */
    #topbar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 20;
      padding: max(env(safe-area-inset-top), 14px) 18px 10px;
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(to bottom, rgba(14,12,20,.97) 55%, transparent);
    }
    .topbar-title { font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.3); }
    .filter-row { display: flex; gap: 5px; }
    .filter-btn { font-size: 11px; padding: 4px 10px; border-radius: 20px; border: .5px solid rgba(255,255,255,.18); background: transparent; color: rgba(255,255,255,.38); cursor: pointer; font-family: var(--sans); transition: all .18s; }
    .filter-btn.active { background: rgba(255,255,255,.12); color: rgba(255,255,255,.9); border-color: rgba(255,255,255,.35); }

    /* ── FEED ── */
    #feed { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    #feed::-webkit-scrollbar { display: none; }

    /* ── CARD ── */
    .card { height: 100dvh; scroll-snap-align: start; display: flex; flex-direction: column; justify-content: center; padding: 80px 28px 110px; position: relative; }
    .card-glow { position: absolute; inset: 0; pointer-events: none; }
    .card-inner { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: center; max-height: 450px; overflow: hidden; }
    .card-inner.rtl { direction: rtl; text-align: right; }

    .source-label { font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 16px; display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
    .card-inner.rtl .source-label { flex-direction: row-reverse; letter-spacing: 0; }
    .source-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }

    .quote-title { font-size: 11px; font-weight: 400; letter-spacing: .07em; text-transform: uppercase; margin-bottom: 13px; color: rgba(255,255,255,.35); flex-shrink: 0; }
    .card-inner.rtl .quote-title { font-size: 14px; letter-spacing: 0; text-transform: none; }

    .quote-body { font-family: var(--serif); font-style: italic; line-height: 1.65; color: rgba(255,255,255,.93); margin-bottom: 20px; }
    .card-inner.rtl .quote-body { font-style: normal; line-height: 1.95; font-family: Georgia, serif; }

    .quote-meta { font-size: 11px; color: rgba(255,255,255,.24); letter-spacing: .04em; flex-shrink: 0; }
    .card-inner.rtl .quote-meta { letter-spacing: 0; font-size: 12px; }

    /* ── SIDE ACTIONS ── */
    .side-actions { position: absolute; right: 14px; bottom: 108px; display: flex; flex-direction: column; gap: 14px; z-index: 5; }
    .side-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; cursor: pointer; padding: 0; }
    .side-icon { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.07); border: .5px solid rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; font-size: 15px; color: rgba(255,255,255,.7); transition: background .18s; }
    .side-icon:active { background: rgba(255,255,255,.18); }
    .side-label { font-size: 10px; color: rgba(255,255,255,.3); }

    /* ── BOTTOM BAR ── */
    #bottombar {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
      padding: 8px 18px max(env(safe-area-inset-bottom), 18px);
      background: linear-gradient(to top, rgba(14,12,20,.98) 65%, transparent);
      display: flex; flex-direction: column; gap: 8px;
    }
    .dots { display: flex; gap: 4px; justify-content: center; }
    .dot { height: 3px; border-radius: 2px; background: rgba(255,255,255,.16); transition: all .3s; width: 12px; }
    .dot.active { background: rgba(255,255,255,.7); width: 20px; }
    .btn-row { display: flex; gap: 8px; }
    .btn { flex: 1; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: var(--sans); border: .5px solid rgba(255,255,255,.14); background: rgba(255,255,255,.07); color: rgba(255,255,255,.55); transition: all .18s; }
    .btn:active { background: rgba(255,255,255,.13); color: white; }
    .btn-primary { background: rgba(255,255,255,.88); color: #111; border-color: transparent; }
    .btn-primary:active { background: white; }

    /* ── TOAST ── */
    #toast { position: absolute; bottom: 115px; left: 50%; transform: translateX(-50%) translateY(8px); background: rgba(30,28,40,.96); border: .5px solid rgba(255,255,255,.18); color: rgba(255,255,255,.82); font-size: 13px; padding: 8px 18px; border-radius: 20px; opacity: 0; transition: all .25s; z-index: 30; white-space: nowrap; pointer-events: none; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── FRESHNESS BADGE ── */
    #freshness { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); font-size: 10px; color: rgba(255,255,255,.18); z-index: 25; white-space: nowrap; letter-spacing: .04em; }
  </style>
</head>
<body>
<div id="app">

  <div id="loading">
    <div class="loading-icon">✦</div>
    <div class="loading-title">Daily Lectio</div>
    <div class="loading-sub" id="loading-msg">Gathering today's meditations…</div>
    <div class="spinner"></div>
  </div>

  <div id="error">
    <div class="err-msg" id="error-msg">Could not load meditations.<br>Check your connection and try again.</div>
    <button class="retry-btn" onclick="init()">Try again</button>
  </div>

  <div id="freshness"></div>

  <div id="topbar">
    <span class="topbar-title">Daily Lectio</span>
    <div class="filter-row">
      <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
      <button class="filter-btn" onclick="setFilter('nouwen',this)">Nouwen</button>
      <button class="filter-btn" onclick="setFilter('raiati',this)">رعيتي</button>
    </div>
  </div>

  <div id="feed"></div>

  <div id="bottombar">
    <div class="dots" id="dots"></div>
    <div class="btn-row">
      <button class="btn" onclick="copyCard()">Copy</button>
      <button class="btn btn-primary" onclick="shareCard()">Share ↗</button>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
  // ── Replace this with your actual Vercel URL once deployed ──
  const API_URL = '/api/quotes';

  const PAL = {
    nouwen: {
      glow: 'radial-gradient(ellipse at 20% 50%,rgba(127,119,221,.2),transparent 65%),radial-gradient(ellipse at 80% 20%,rgba(83,74,183,.12),transparent 55%)',
      accent: '#a78bfa', dot: '#7c3aed', label: 'Henri Nouwen Society'
    },
    raiati: {
      glow: 'radial-gradient(ellipse at 25% 45%,rgba(29,158,117,.17),transparent 65%),radial-gradient(ellipse at 75% 25%,rgba(15,110,86,.1),transparent 55%)',
      accent: '#5eead4', dot: '#0d9488', label: 'نشرة رعيتي — المطران جورج خضر'
    }
  };

  const LOCAL_CACHE_KEY = 'daily_lectio_v1';
  const LOCAL_CACHE_TTL = 12 * 60 * 60 * 1000; // 12h

  let allQuotes = [];
  let visible = [];
  let curIdx = 0;
  let activeFilter = 'all';

  // ── LOCAL CACHE ──────────────────────────────────────
  function saveLocal(data) {
    try { localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ ts: Date.now(), data })); } catch(e) {}
  }
  function loadLocal() {
    try {
      const raw = localStorage.getItem(LOCAL_CACHE_KEY);
      if (!raw) return null;
      const { ts, data } = JSON.parse(raw);
      if (Date.now() - ts < LOCAL_CACHE_TTL) return data;
    } catch(e) {}
    return null;
  }

  // ── INIT ─────────────────────────────────────────────
  async function init() {
    document.getElementById('error').classList.remove('show');
    document.getElementById('loading').style.display = 'flex';
    document.getElementById('loading').classList.remove('fade');

    // Show local cache instantly while we fetch
    const local = loadLocal();
    if (local && local.length > 0) {
      allQuotes = local;
      showApp('From cache — refreshing…');
      fetchAndUpdate(); // update in background
      return;
    }

    await fetchAndUpdate();
  }

  async function fetchAndUpdate() {
    setMsg('Fetching today\'s meditations…');
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error('API returned ' + res.status);
      const json = await res.json();
      if (!json.quotes || json.quotes.length === 0) throw new Error('No quotes returned');

      allQuotes = json.quotes;
      saveLocal(allQuotes);

      const ts = new Date(json.cachedAt).toLocaleDateString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
      showApp('Updated ' + ts);
    } catch(e) {
      console.error(e);
      if (allQuotes.length > 0) {
        // Already showing stale cache — just update badge
        document.getElementById('freshness').textContent = 'Offline — showing cached';
        hideLoding();
      } else {
        showError('Could not load meditations.\n' + e.message);
      }
    }
  }

  function setMsg(m) { document.getElementById('loading-msg').textContent = m; }

  function showApp(freshnessText) {
    applyFilter(activeFilter);
    renderFeed();
    document.getElementById('freshness').textContent = freshnessText || '';
    hideLoding();
  }

  function hideLoding() {
    const l = document.getElementById('loading');
    l.classList.add('fade');
    setTimeout(() => l.style.display = 'none', 500);
  }

  function showError(msg) {
    document.getElementById('error-msg').textContent = msg;
    document.getElementById('error').classList.add('show');
    document.getElementById('loading').style.display = 'none';
  }

  // ── FILTER ───────────────────────────────────────────
  function applyFilter(src) {
    activeFilter = src;
    visible = src === 'all' ? [...allQuotes] : allQuotes.filter(q => q.src === src);
    if (visible.length === 0) visible = [...allQuotes];
    curIdx = 0;
  }

  function setFilter(src, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilter(src);
    renderFeed();
  }

  // ── RENDER ───────────────────────────────────────────
  function fitText(card) {
    const body = card.querySelector('.quote-body');
    const container = card.querySelector('.card-inner');
    let size = 21;
    body.style.fontSize = size + 'px';
    while (container.scrollHeight > container.clientHeight && size > 12) {
      size -= 0.5;
      body.style.fontSize = size + 'px';
    }
  }

  function renderFeed() {
    const feed = document.getElementById('feed');
    const dots = document.getElementById('dots');
    feed.innerHTML = '';
    dots.innerHTML = visible.map((_, i) =>
      `<div class="dot${i === 0 ? ' active' : ''}" id="dot-${i}"></div>`
    ).join('');

    visible.forEach((q, i) => {
      const p = PAL[q.src] || PAL.nouwen;
      const isAr = q.src === 'raiati';
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-glow" style="background:${p.glow};"></div>
        <div class="card-inner${isAr ? ' rtl' : ''}">
          <div class="source-label" style="color:${p.accent};">
            <div class="source-dot" style="background:${p.dot};"></div>
            ${p.label}
          </div>
          <div class="quote-title">${q.title}</div>
          <div class="quote-body">${q.body}</div>
          <div class="quote-meta">${q.date}</div>
        </div>
        <div class="side-actions">
          <button class="side-btn" onclick="copyIdx(${i})">
            <div class="side-icon">⎘</div>
            <div class="side-label">Copy</div>
          </button>
          <button class="side-btn" onclick="shareIdx(${i})">
            <div class="side-icon">↑</div>
            <div class="side-label">Share</div>
          </button>
        </div>`;
      feed.appendChild(card);
      fitText(card);
    });

    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          curIdx = parseInt(e.target.dataset.i);
          document.querySelectorAll('.dot').forEach((d, j) =>
            d.classList.toggle('active', j === curIdx)
          );
        }
      });
    }, { threshold: 0.6, root: feed });

    feed.querySelectorAll('.card').forEach((c, i) => { c.dataset.i = i; obs.observe(c); });
  }

  // ── ACTIONS ──────────────────────────────────────────
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  function copyIdx(i) {
    const q = visible[i];
    const text = `"${q.body}"\n— ${PAL[q.src].label} (${q.title})`;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => showToast('Copied!'));
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      showToast('Copied!');
    }
  }

  function shareIdx(i) {
    const q = visible[i];
    const text = `"${q.body}"\n— ${PAL[q.src].label} (${q.title})`;
    if (navigator.share) navigator.share({ text });
    else { copyIdx(i); showToast('Copied to clipboard!'); }
  }

  function copyCard() { copyIdx(curIdx); }
  function shareCard() { shareIdx(curIdx); }

  init();
</script>
</body>
</html>
