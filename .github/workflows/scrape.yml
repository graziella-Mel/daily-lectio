name: Daily Scrape

on:
  schedule:
    - cron: '0 5 * * *'   # every day at 5am UTC (8am Beirut)
  workflow_dispatch:        # also lets you trigger it manually from GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit quotes.json back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node scrape.js

      - name: Commit quotes.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          git diff --staged --quiet || git commit -m "Daily quotes update $(date -u '+%Y-%m-%d')"
          git push
